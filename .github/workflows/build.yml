name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Unpack project
        run: |
          unzip -q apk-project.zip -d proj
          # optional: licence public key made with keygen.py init (put license_pub.txt next to apk-project.zip)
          if [ -f license_pub.txt ]; then cp license_pub.txt proj/KhmerStudio-APK/app/src/main/assets/; echo "licence ON"; else echo "licence OFF (no license_pub.txt)"; fi

      - name: ffmpeg (static musl arm64 - runs inside Android apps)
        run: |
          J=proj/KhmerStudio-APK/app/src/main/jniLibs/arm64-v8a
          mkdir -p $J
          id=$(docker create --platform linux/arm64 mwader/static-ffmpeg:latest)
          docker cp $id:/ffmpeg $J/libffmpeg.so
          docker rm $id
          file $J/libffmpeg.so
          ls -la $J

      - name: whisper.cpp (NDK, arm64)
        run: |
          J=$PWD/proj/KhmerStudio-APK/app/src/main/jniLibs/arm64-v8a
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"; echo "NDK=$NDK"
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp w
          COMMON="-DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF"
          cmake -S w -B b0 $COMMON
          cmake --build b0 -j4 --target whisper-cli
          cp "$(find b0 -name whisper-cli -type f | head -1)" $J/libwhisper.so
          cmake -S w -B b1 $COMMON -DCMAKE_C_FLAGS=-march=armv8.2-a+dotprod -DCMAKE_CXX_FLAGS=-march=armv8.2-a+dotprod
          cmake --build b1 -j4 --target whisper-cli
          cp "$(find b1 -name whisper-cli -type f | head -1)" $J/libwhisper_dp.so
          file $J/*.so; ls -la $J

      - name: Build APK
        run: cd proj/KhmerStudio-APK && gradle assembleDebug --no-daemon --stacktrace

      - name: Rename
        run: cp proj/KhmerStudio-APK/app/build/outputs/apk/debug/app-debug.apk KhmerStudio.apk && ls -la KhmerStudio.apk
      - uses: actions/upload-artifact@v4
        with: { name: KhmerStudio-APK, path: KhmerStudio.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Khmer Studio APK ${{ github.run_number }}
          files: KhmerStudio.apk
